<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leardle - Educational Word Guessing Game</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Leardle</h1>
            <button id="themeToggle" aria-label="Toggle dark mode">🌓</button>
        </header>

        <main>
            <div id="inputSection" class="section">
                <h2>Input Your Terms</h2>
                <textarea id="termsInput" placeholder="Paste your terms and definitions here..."></textarea>
                <div class="button-group">
                    <button id="parseJSON">Parse JSON</button>
                    <button id="parsePlaintext">Parse Plaintext</button>
                    <button id="startGame">Start Game</button>
                </div>
            </div>

            <div id="gameSection" class="section hidden">
                <div class="game-info">
                    <p id="currentDefinition"></p>
                    <p id="attemptsLeft">Attempts left: 5</p>
                </div>
                
                <div class="guess-input">
                    <input type="text" id="guessInput" placeholder="Enter your guess">
                    <button id="submitGuess">Submit</button>
                </div>

                <div id="guessHistory"></div>
                
                <div class="feedback-area">
                    <p id="feedbackMessage"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2024 Leardle - Educational Word Guessing Game</p>
        </footer>
    </div>

    <script src="scripts/game.js"></script>
    <script src="scripts/ui.js"></script>
</body>
</html>
